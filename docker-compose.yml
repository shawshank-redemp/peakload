# Peakload: one command brings up infrastructure, the four services and monitoring.
#   docker compose up --build
# Infra only (run the services from your IDE instead):
#   docker compose up postgres redis redpanda prometheus grafana
# Host ports for postgres and grafana come from .env (see README). MinIO is behind the "later" profile.

services:
  # ---------- infrastructure ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: peakload
      POSTGRES_USER: peakload
      POSTGRES_PASSWORD: peakload
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    # pg_stat_statements is preloaded (Week 4 database baseline). Cost: a hash and a counter update per statement.
    # track=all also records statements inside functions. Restart needed to change this.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peakload -d peakload"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    # Not needed until week 4. Start explicitly with: docker compose --profile later up minio
    profiles: ["later"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: peakload
      MINIO_ROOT_PASSWORD: peakload123
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  # ---------- monitoring ----------
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]

  # ---------- services ----------
  # In week 0 the services do not use the infrastructure yet. From week 1 on,
  # add depends_on: { postgres: { condition: service_healthy } } etc. as each one needs it.
  admission:
    build: { context: ., args: { SERVICE: admission } }
    ports: ["8080:8080"]
    environment:
      # Same Postgres server; admission uses its own "admission" schema (set in its config).
      DB_URL: jdbc:postgresql://postgres:5432/peakload
      # The order service, inside the compose network.
      ORDER_URL: http://order:8081
      # Rate-limit buckets live in Redis.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Rate-limit settings, from the shell that runs compose (defaults are the placeholders in application.yml).
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_CRITICAL_CAPACITY: ${RATE_LIMIT_CRITICAL_CAPACITY:-200}
      RATE_LIMIT_CRITICAL_REFILL: ${RATE_LIMIT_CRITICAL_REFILL:-100}
      RATE_LIMIT_STANDARD_CAPACITY: ${RATE_LIMIT_STANDARD_CAPACITY:-200}
      RATE_LIMIT_STANDARD_REFILL: ${RATE_LIMIT_STANDARD_REFILL:-100}
      RATE_LIMIT_LOW_CAPACITY: ${RATE_LIMIT_LOW_CAPACITY:-100}
      RATE_LIMIT_LOW_REFILL: ${RATE_LIMIT_LOW_REFILL:-50}
      RATE_LIMIT_BREAKER_ENABLED: ${RATE_LIMIT_BREAKER_ENABLED:-true}
      RATE_LIMIT_BREAKER_COOLDOWN: ${RATE_LIMIT_BREAKER_COOLDOWN:-PT2S}
      # Load shedding. SHED_ENABLED=false turns it off for comparison runs (thresholds are in application.yml).
      SHED_ENABLED: ${SHED_ENABLED:-true}
      # Week 5 retry and circuit breaker, for the measurement. Set to false to turn each off.
      RETRY_ENABLED: ${RETRY_ENABLED:-true}
      CIRCUIT_ENABLED: ${CIRCUIT_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      order:
        condition: service_healthy

  order:
    build: { context: ., args: { SERVICE: order } }
    ports: ["8081:8081"]
    environment:
      # Inside the compose network the database is reachable as postgres:5432, not localhost.
      DB_URL: jdbc:postgresql://postgres:5432/peakload
      # Inside the compose network the broker is redpanda:9092 (19092 is the host-side listener).
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    # Healthy when the actuator answers UP. Bash is used because the JRE image has no curl.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081 && printf \"GET /actuator/health HTTP/1.0\\r\\nHost: x\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  dispatch:
    build: { context: ., args: { SERVICE: dispatch } }
    ports: ["8082:8082"]
    environment:
      # Same Postgres server as the order service, in the "dispatch" schema (set by the service's config).
      DB_URL: jdbc:postgresql://postgres:5432/peakload
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Not used by consumers until step 2; set now so the service can reach the broker from its first start.
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  tracking:
    build: { context: ., args: { SERVICE: tracking } }
    ports: ["8083:8083"]

  # ---------- load test ----------
  # Runs inside the compose network, so traffic does not go through host port forwarding.
  #   docker compose --profile loadtest run --rm k6 run /loadtest/baseline.js
  # Change the rate with: docker compose --profile loadtest run --rm -e RATE=400 k6 run /loadtest/baseline.js
  k6:
    profiles: ["loadtest"]
    image: grafana/k6:latest
    volumes: ["./loadtest:/loadtest:ro"]
    environment:
      BASE_URL: http://admission:8080
    depends_on: [admission]

volumes:
  pgdata:
  miniodata:
