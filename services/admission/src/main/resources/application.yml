server:
  port: 8080
  # Port stays 8080 (published by compose) until the measurement step says otherwise.

spring:
  application:
    name: admission

  # Each request runs on a virtual thread, so the blocking upstream calls are cheap to wait on.
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/peakload}
    username: ${DB_USER:peakload}
    password: ${DB_PASSWORD:peakload}
    hikari:
      # Menu reads run in the "admission" schema, as the dispatch service does for its own tables.
      schema: admission
      # Fixed-size pool, same pattern as the other services. The browse endpoint is the only DB user.
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 2000

  data:
    redis:
      # The rate limiter's buckets. Commands time out after 50 ms; the limiter then fails open.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 50ms

  flyway:
    enabled: true
    schemas: admission
    create-schemas: true
    locations: classpath:db/migration

peakload:
  admission:
    rate-limit:
      # PLACEHOLDERS, NOT RECOMMENDATIONS. Chosen only so the code runs. Not measured.
      # capacity = burst size in requests; refill-per-second = sustained rate per client, per class.
      enabled: ${RATE_LIMIT_ENABLED:true}
      classes:
        CRITICAL:
          capacity: ${RATE_LIMIT_CRITICAL_CAPACITY:200}
          refill-per-second: ${RATE_LIMIT_CRITICAL_REFILL:100}
        STANDARD:
          capacity: ${RATE_LIMIT_STANDARD_CAPACITY:200}
          refill-per-second: ${RATE_LIMIT_STANDARD_REFILL:100}
        LOW:
          capacity: ${RATE_LIMIT_LOW_CAPACITY:100}
          refill-per-second: ${RATE_LIMIT_LOW_REFILL:50}
      circuit-breaker:
        # When Redis fails, requests use the local buckets; Redis is not called until the cool-down ends,
        # then one probe is sent. Disable to call Redis for every request (measurement only).
        enabled: ${RATE_LIMIT_BREAKER_ENABLED:true}
        cool-down: ${RATE_LIMIT_BREAKER_COOLDOWN:PT2S}
      local:
        # Local limits relate to the Redis ones by these factors. 1.0 = same capacity and rate as Redis.
        # With N admission instances, the effective limit during an outage can be up to N times the configured one.
        capacity-factor: ${RATE_LIMIT_LOCAL_CAPACITY_FACTOR:1.0}
        refill-factor: ${RATE_LIMIT_LOCAL_REFILL_FACTOR:1.0}
        # Bounded memory: most buckets kept at once; the least recently used one is evicted beyond this.
        max-keys: ${RATE_LIMIT_LOCAL_MAX_KEYS:50000}
        idle-expiry: PT5M
    shed:
      # PLACEHOLDERS, NOT RECOMMENDATIONS. Unmeasured starting values. The Week 3 Step 4 measurement is what they
      # should be checked against; they are not tuned to it. false = no request is shed (for comparison runs).
      enabled: ${SHED_ENABLED:true}
      # In-flight is a fraction of the upstream pool (max-connections below). It counts every class, including
      # local menu reads. Each level is entered at its enter value and left at its lower exit value (hysteresis).
      # Latency is the smoothed (EWMA) order-service call time in ms; enter and exit work the same way.
      elevated:   # sheds LOW
        in-flight-enter: 0.50
        in-flight-exit: 0.40
        latency-enter-ms: 250
        latency-exit-ms: 150
      high:       # sheds LOW and STANDARD
        in-flight-enter: 0.75
        in-flight-exit: 0.60
        latency-enter-ms: 1000
        latency-exit-ms: 600
      hard-cap:   # sheds everything, including CRITICAL, without queueing
        in-flight-enter: 0.95
        in-flight-exit: 0.85
        latency-enter-ms: 2500
        latency-exit-ms: 1500
      # Weight of the newest upstream sample in the EWMA (0 < smoothing <= 1).
      smoothing: 0.2
      # The smoothed latency halves this often while no upstream calls are made, so recovery is seen without traffic.
      latency-half-life: PT5S
      # Sent as Retry-After with a shed (503). Rounded up to whole seconds, at least 1.
      retry-after: PT1S
    upstream:
      # Where POST /orders and the other order routes are sent.
      order-url: ${ORDER_URL:http://localhost:8081}
      # Opening a TCP connection to the upstream. A longer wait means the upstream is effectively down.
      connect-timeout: ${UPSTREAM_CONNECT_TIMEOUT:PT0.5S}
      # Waiting for the upstream's response after the request was sent. Timeout here gives 504.
      read-timeout: ${UPSTREAM_READ_TIMEOUT:PT2S}
      # Waiting for a free pooled connection. Timeout here gives 503 (the pool is full).
      connection-request-timeout: ${UPSTREAM_POOL_WAIT:PT0.5S}
      # Upper bound on simultaneous upstream connections. Requests beyond it wait up to the pool wait, then get
      # 503. The number is a fixed starting value, not a measured result; it is above the Week 3 test load.
      max-connections: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: admission
    distribution:
      # Needed for p95/p99 latency panels in Grafana.
      percentiles-histogram:
        http.server.requests: true
