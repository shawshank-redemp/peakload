server:
  port: 8082

spring:
  application:
    name: dispatch

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/peakload}
    username: ${DB_USER:peakload}
    password: ${DB_PASSWORD:peakload}
    hikari:
      # Every JDBC statement runs in the "dispatch" schema (Hikari sets the connection's search_path).
      # The order service uses the default "public" schema on the same database, so the two services
      # never share table names.
      schema: dispatch
      # Fixed-size pool, as in the order service: min-idle equals max, so connections are opened once and
      # never reopened under load. 10 is a starting guess, not a measured result.
      maximum-pool-size: 10
      minimum-idle: 10
      # Fail a request after 2 s if no connection is free, rather than queueing indefinitely.
      connection-timeout: 2000

  flyway:
    enabled: true
    # Flyway manages only the "dispatch" schema. It creates the schema if missing, and keeps its own
    # history table there (dispatch.flyway_schema_history). The order service's history is in public,
    # so the two histories cannot clash.
    schemas: dispatch
    create-schemas: true
    locations: classpath:db/migration

  data:
    redis:
      # Redis is a hint store only (GEO positions, last-seen keys, the rider city cache). It never holds
      # assignment truth. A bounded timeout means a stuck Redis fails a request instead of hanging it.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  kafka:
    # Inside compose this is redpanda:9092 (set by docker-compose.yml). From the host it is localhost:19092.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      # Same producer settings and timeout invariant as the order service (see its application.yml):
      #   max.block.ms <= delivery.timeout.ms <= peakload.dispatch.relay.send-wait
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 0
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        max.block.ms: 10000
    consumer:
      # A new consumer group starts at the newest event, so dispatch does not replay every historical
      # OrderCreated when it first starts. Committed offsets survive restarts.
      auto-offset-reset: latest

peakload:
  dispatch:
    location:
      # How long a location ping keeps a rider "fresh". The seen key expires after this time; the GEO
      # entry does not expire by itself. Candidates are filtered by the seen key.
      last-seen-ttl: ${LAST_SEEN_TTL:PT30S}
    assignment:
      # Search radius around the pickup point, and how many fresh candidates to try (nearest first).
      radius-km: ${ASSIGNMENT_RADIUS_KM:3}
      max-candidates: ${ASSIGNMENT_MAX_CANDIDATES:10}
    pending:
      # Pause between retry runs; how long an order may wait before it is given up; orders per run.
      retry-interval: ${PENDING_RETRY_INTERVAL:PT5S}
      max-age: ${PENDING_MAX_AGE:PT15M}
      batch-size: 200
    relay:
      # Outbox rows per batch, and the longest wait for one broker ack. send-wait must exceed the producer's
      # delivery.timeout.ms (10 s above).
      interval: ${DISPATCH_RELAY_INTERVAL:PT1S}
      batch-size: 100
      send-wait: PT15S

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: dispatch
    distribution:
      # Needed for p95/p99 latency panels in Grafana.
      percentiles-histogram:
        http.server.requests: true
