
server:
  port: 8081

spring:
  application:
    name: order

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/peakload}
    username: ${DB_USER:peakload}
    password: ${DB_PASSWORD:peakload}
    hikari:
      # Fixed-size pool: minimum-idle equals maximum-pool-size, so connections are opened once
      # and never closed or reopened under load (no connection-setup spikes during a surge).
      # 10 is a starting guess, not a measured result. Revisit after the Step 6 load test.
      maximum-pool-size: 10
      minimum-idle: 10
      # Fail a request after 2 s if no connection is free, rather than queueing it indefinitely.
      connection-timeout: 2000

  flyway:
    enabled: true
    locations: classpath:db/migration

peakload:
  idempotency:
    # How long a key is remembered. After this time the same key counts as unseen and a
    # retry creates a new order. Measured in ISO-8601 (PT24H = 24 hours).
    ttl: ${IDEMPOTENCY_TTL:PT24H}
    cleanup:
      # Pause between cleanup runs.
      interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:PT1M}
      # Rows deleted per statement. Small batches keep each delete short.
      batch-size: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: order
    distribution:
      # Needed for p95/p99 latency panels in Grafana.
      percentiles-histogram:
        http.server.requests: true
