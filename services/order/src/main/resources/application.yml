
server:
  port: 8081

spring:
  application:
    name: order

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/peakload}
    username: ${DB_USER:peakload}
    password: ${DB_PASSWORD:peakload}
    hikari:
      # Fixed-size pool: minimum-idle equals maximum-pool-size, so connections are opened once
      # and never closed or reopened under load (no connection-setup spikes during a surge).
      # 10 is a starting guess, not a measured result. Revisit after the Step 6 load test.
      maximum-pool-size: 10
      minimum-idle: 10
      # Fail a request after 2 s if no connection is free, rather than queueing it indefinitely.
      connection-timeout: 2000

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    # Inside compose this is redpanda:9092 (set by docker-compose.yml). From the host it is localhost:19092.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      # acks=all: the broker acknowledges only after all in-sync replicas have the message.
      acks: all
      properties:
        # Idempotent producer: a retried send does not create a duplicate in the partition.
        # This does not make the whole pipeline exactly-once; consumers still deduplicate.
        enable.idempotence: true
    consumer:
      # A new consumer group starts from the oldest message, so no events are skipped on first start.
      auto-offset-reset: earliest

peakload:
  outbox:
    relay:
      # Pause between relay runs, and rows per batch. Each row is sent and acknowledged one at a time.
      interval: ${OUTBOX_RELAY_INTERVAL:PT1S}
      batch-size: 100
  idempotency:
    # How long a key is remembered. After this time the same key counts as unseen and a
    # retry creates a new order. Measured in ISO-8601 (PT24H = 24 hours).
    ttl: ${IDEMPOTENCY_TTL:PT24H}
    cleanup:
      # Pause between cleanup runs.
      interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:PT1M}
      # Rows deleted per statement. Small batches keep each delete short.
      batch-size: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: order
    distribution:
      # Needed for p95/p99 latency panels in Grafana.
      percentiles-histogram:
        http.server.requests: true
