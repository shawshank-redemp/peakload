
server:
  port: 8081

spring:
  application:
    name: order

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/peakload}
    username: ${DB_USER:peakload}
    password: ${DB_PASSWORD:peakload}
    hikari:
      # Fixed-size pool: minimum-idle equals maximum-pool-size, so connections are opened once
      # and never closed or reopened under load (no connection-setup spikes during a surge).
      # 10 is a starting guess, not a measured result. Revisit after the Step 6 load test.
      maximum-pool-size: 10
      minimum-idle: 10
      # Fail a request after 2 s if no connection is free, rather than queueing it indefinitely.
      connection-timeout: 2000

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    # Inside compose this is redpanda:9092 (set by docker-compose.yml). From the host it is localhost:19092.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      # acks=all: the broker acknowledges only after all in-sync replicas have the message.
      acks: all
      properties:
        # Idempotent producer: a retried send does not create a duplicate in the partition.
        # This does not make the whole pipeline exactly-once; consumers still deduplicate.
        enable.idempotence: true
        # Timeout invariant, from the outside in:
        #   max.block.ms <= delivery.timeout.ms <= peakload.outbox.relay.send-wait
        # Why each link holds:
        # - linger.ms + request.timeout.ms <= delivery.timeout.ms is required by Kafka. Here 0 + 5 s <= 10 s.
        # - request.timeout.ms (5 s) is one attempt. The producer retries until delivery.timeout.ms (10 s),
        #   then fails the send with a final result.
        # - max.block.ms bounds the send() call itself. send() blocks while it waits for topic metadata
        #   (for example during a broker outage on a cold producer). Without this bound it blocks for
        #   Kafka's default of 60 s, which is longer than the relay's wait.
        # - The relay waits send-wait (15 s) for the future. That is longer than delivery.timeout.ms, so
        #   the final result always arrives first. The relay never retries a row while an earlier copy
        #   may still be in flight, and so it does not create a late duplicate.
        linger.ms: 0
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        max.block.ms: 10000
    consumer:
      # A new consumer group starts from the oldest message, so no events are skipped on first start.
      auto-offset-reset: earliest

peakload:
  outbox:
    relay:
      # Pause between relay runs, and rows per batch. Each row is sent and acknowledged one at a time.
      interval: ${OUTBOX_RELAY_INTERVAL:PT1S}
      batch-size: 100
      # Upper bound on waiting for one ack. Must be longer than delivery.timeout.ms (10 s); see the
      # timeout invariant under spring.kafka.producer.properties.
      send-wait: PT15S
    # Monthly partitions of the outbox (migration V6). The job creates months ahead and drops a month only when it is
    # older than retention AND has no unpublished row. Values are starting values, not measured results.
    partitions:
      months-ahead: 3
      retention: ${OUTBOX_RETENTION:P30D}
      initial-delay: PT1M
      interval: PT1H
  idempotency:
    # How long a key is remembered. After this time the same key counts as unseen and a
    # retry creates a new order. Measured in ISO-8601 (PT24H = 24 hours).
    ttl: ${IDEMPOTENCY_TTL:PT24H}
    cleanup:
      # Pause between cleanup runs.
      interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:PT1M}
      # Rows deleted per statement. Small batches keep each delete short.
      batch-size: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: order
    distribution:
      # Needed for p95/p99 latency panels in Grafana.
      percentiles-histogram:
        http.server.requests: true
